name: Build Krita (Arch PKGBUILD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install deps from PKGBUILD
        run: |
          # extract depends + makedepends arrays
          DEPENDS=$(source PKGBUILD && echo ${depends[@]} ${makedepends[@]})
          pacman -S --noconfirm --needed $DEPENDS

      - name: Build package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder bash -lc "
            cd $PWD
            makepkg -s --noconfirm --skipinteg --skippgpcheck --skipchecksums
          "

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: krita-pkg
          path: "*.pkg.tar.zst"
