name: Build Krita (Arch PKGBUILD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install package dependencies from PKGBUILD
        run: |
          cd $GITHUB_WORKSPACE
          deps=$(bash -c '
            source PKGBUILD
            echo "${depends[@]} ${makedepends[@]}"
          ')
          echo "Installing dependencies: $deps"
          if [ -n "$deps" ]; then
            pacman -S --noconfirm --needed $deps
          fi

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder $GITHUB_WORKSPACE

      - name: Build package with makepkg (non-root)
        run: |
          sudo -u builder bash -lc "
            cd $GITHUB_WORKSPACE
            makepkg -s --noconfirm --skipinteg --skippgpcheck --skipchecksums
          "

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: krita-pkg
          path: "*.pkg.tar.zst"
