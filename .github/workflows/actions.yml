name: Build Krita (Arch PKGBUILD)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install package dependencies from PKGBUILD
        run: |
          cd $GITHUB_WORKSPACE
          # Extract depends and makedepends arrays from PKGBUILD
          depends=$(bash -c "source PKGBUILD && echo \${depends[@]} \${makedepends[@]}")
          echo "Installing dependencies: $depends"
          pacman -S --noconfirm --needed $depends

      - name: Build package with makepkg
        run: |
          cd $GITHUB_WORKSPACE
          # Run makepkg without sudo, since deps are already installed
          makepkg -s --noconfirm --skipinteg --skippgpcheck --skipchecksums

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: krita-pkg
          path: "*.pkg.tar.zst"
